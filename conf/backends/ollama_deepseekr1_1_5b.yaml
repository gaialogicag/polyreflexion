# Open-weights lower-bound sweep, small tier: deepseek-r1:1.5b (reasoning
# model, emits <think> chains). See ollama_phi4_mini_reasoning.yaml for the
# pattern.

defaults:
  - base_backends
  - /backends/role@answerer: ollama
  - /backends/role@judge: ollama
  - /backends/role@meta_judge: ollama
  - _self_

answerer:
  model: deepseek-r1:1.5b
  num_predict: 2048

judge:
  model: qwen2.5:14b

meta_judge:
  model: llama3.1:8b
