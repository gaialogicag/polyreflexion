# Same as openai_judge5mini_xhigh_jevmeta.yaml, but the answerer thinks at
# low reasoning effort instead of xhigh -- another point on the none/low/
# medium/xhigh sweep (EXP-17) checking whether the none-vs-xhigh collapse is
# a smooth trend or a step that only appears at the top of the effort scale.

defaults:
  - base_backends
  - /backends/role@answerer: openai
  - /backends/role@judge: openai
  - /backends/role@meta_judge: anyjev
  - _self_

answerer:
  model: gpt-5.4-nano
  reasoning_effort: low

judge:
  model: gpt-5-mini
  system_prompt: You are a careful grader. Answer only with the requested label.

meta_judge:
  model: Qwen/Qwen2.5-1.5B-Instruct
  backend_kind: hf
  level: L0
