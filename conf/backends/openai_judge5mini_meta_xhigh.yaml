# Answerer at xhigh reasoning effort (gpt-5.4-nano), both judging roles on
# gpt-5-mini -- unlike openai_judge5mini.yaml, meta_judge is gpt-5-mini here
# too, not gpt-4o, per this run's explicit scope.

defaults:
  - base_backends
  - /backends/role@answerer: openai
  - /backends/role@judge: openai
  - /backends/role@meta_judge: openai
  - _self_

answerer:
  model: gpt-5.4-nano
  reasoning_effort: xhigh

judge:
  model: gpt-5-mini
  system_prompt: You are a careful grader. Answer only with the requested label.

meta_judge:
  model: gpt-5-mini
  system_prompt: You are an impartial evaluator of reasoning quality.
