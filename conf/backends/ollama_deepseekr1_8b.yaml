# Open-weights lower-bound sweep, mid tier: deepseek-r1:8b (distilled onto a
# llama3.1-8b base; reasoning model, emits <think> chains).

defaults:
  - base_backends
  - /backends/role@answerer: ollama
  - /backends/role@judge: ollama
  - /backends/role@meta_judge: ollama
  - _self_

answerer:
  model: deepseek-r1:8b
  num_predict: 2048

judge:
  model: qwen2.5:14b

meta_judge:
  model: llama3.1:8b
