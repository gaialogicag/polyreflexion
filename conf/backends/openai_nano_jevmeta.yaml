# Same as openai_nano.yaml, but meta_judge is AnyJev (a typed yes/no verdict
# from a locally-served Qwen2.5-1.5B-Instruct, backend_kind: hf) instead of
# gpt-4o-mini. Everything else -- answerer, judge, open_weights -- unchanged,
# so this isolates the meta_judge swap as the only variable.

defaults:
  - base_backends
  - /backends/role@answerer: openai
  - /backends/role@judge: openai
  - /backends/role@meta_judge: anyjev
  - /backends/role@open_weights: ollama
  - _self_

answerer:
  model: gpt-4.1-nano

judge:
  model: gpt-4.1-nano
  system_prompt: You are a careful grader. Answer only with the requested label.

meta_judge:
  model: Qwen/Qwen2.5-1.5B-Instruct
  backend_kind: hf
  level: L0

open_weights:
  model: phi4-mini-reasoning
