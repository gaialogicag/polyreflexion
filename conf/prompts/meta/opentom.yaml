# Theory-of-Mind: judges score mental-state tracking in the summary.

defaults:
  - base_meta_prompts

judge_subjective: |-
  You are a polycontextural judge for the SUBJECTIVE context (Theory-of-Mind story summary).

  Original narrative:
  {question}

  Integrated story summary under evaluation:
  {answer}

  Perspective artifacts from reflexion (O = objective facts, S = subjective experience, B = conceptual structure):
  {corners}

  Is the summary authentic and internally coherent as a mental-state narrative? Judge coherence of beliefs, intentions, and emotional stance — not whether every inference is objectively true.

  Name the specific statements that drove your verdict.

  Reply with JSON only:
  {{"value": "A" or "F", "rationale": "one short paragraph"}}
judge_objective: |-
  You are a polycontextural judge for the OBJECTIVE context (Theory-of-Mind story summary).

  Original narrative:
  {question}

  Integrated story summary under evaluation:
  {answer}

  Is the summary objectively faithful to the narrative? Check: character names, object locations, moves, who witnessed what, and especially FALSE BELIEFS (what a character thinks vs what is actually true). Penalize invented facts or dropped false-belief structure.

  Name the specific statements that drove your verdict.

  Reply with JSON only:
  {{"value": "W" or "F", "rationale": "one short paragraph"}}
judge_dialectical: |-
  You are a polycontextural judge for the DIALECTICAL context (Theory-of-Mind story summary).

  Original narrative:
  {question}

  Integrated story summary under evaluation:
  {answer}

  Previous cycle's summary (may be '(none)' on the first cycle):
  {previous_answer}

  Does this summary add useful Theory-of-Mind detail (perspective differences, belief contrasts, accessibility changes) that was not already explicit in the previous summary? Or is it merely a paraphrase with no new mental-state information?

  Name the specific statements that drove your verdict.

  Reply with JSON only:
  {{"value": "W" or "R", "rationale": "one short paragraph"}}
boundary_negation: |-
  You are refining a Theory-of-Mind story summary along the {dimension} axis.

  Original narrative:
  {question}

  Current integrated summary:
  {answer}

  Judge feedback:
  {judge_feedback}

  Positive verdict ({dimension}, {verdict_label}):
  {rationale}

  Gaps to address (from failing judges):
  {repair_priorities}

  Write a semantic boundary (2-4 sentences) describing what this summary still omits or blurs in the {dimension} context — especially false beliefs, who knows what, or location changes. Describe the boundary, not a full rewrite. Preserve all character names from the narrative.
expand_input: |-
  Original narrative:
  {question}

  Current integrated story summary:
  {answer}

  Judge feedback (address every NOT satisfied item without dropping correct facts):
  {judge_feedback}

  Expansion axis: {dimension}

  Semantic boundary:
  {boundary}

  Task: Write a NEW integrated story summary (plain English, one concise paragraph) that:
  - Keeps every correct fact, false belief, and location from the current summary and narrative.
  - Adds the mental-state detail implied by the boundary and missing judge concerns.
  - Does NOT answer benchmark questions — only summarize the story for Theory-of-Mind.
  - Avoids filler ("best friends", "good intentions") unless stated in the narrative.
  - States clearly when a character's belief differs from reality.
refine_input: |-
  Original narrative:
  {question}

  Current integrated story summary:
  {answer}

  Judge feedback:
  {judge_feedback}

  Strength to preserve (apex {apex}):
  {apex_guidance}

  [Region]
  Apex: {apex}
  Left boundary ({left_label}): {left_boundary}
  Right boundary ({right_label}): {right_boundary}

  Task: Write a refined integrated story summary inside this region. Fix the failing judge concerns using the two boundaries as constraints. Preserve false-belief structure, locations, and witness information. One concise paragraph; no benchmark Q&A.
contradiction_check: |-
  Boundary A:
  {first}

  Boundary B:
  {second}

  Are these two boundary descriptions mutually contradictory for the same story summary? Reply with exactly one word: yes or no.
drift_check: |-
  Original narrative:
  {question}

  Integrated story summary:
  {answer}

  Does this summary still describe the same story events, characters, and key beliefs as the original narrative (not a different story or topic)? Reply with exactly one word: yes or no.
