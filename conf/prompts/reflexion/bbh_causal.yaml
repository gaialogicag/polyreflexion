# Engine templates for BBH's causal_judgement task: "How would a typical
# person answer this question about causation?" -- an ordinary-language
# causal-attribution judgment (was the black wire a cause of the short
# circuit?), not a theory-of-mind question about what anyone believes.
#
# v1 of this prompt (EXP-25) offered "necessity" (but-for) as one of three
# equally-valid causal principles. Inspecting disagreements where direct
# answered correctly and reflexion did not showed the model defaulting to
# pure counterfactual necessity on BBH's classic symmetric/diffused-
# responsibility items (several people doing the same normal, permitted
# thing at once; each action was individually necessary for the outcome, but
# the "typical person" answer is still No, because none of the actions was
# abnormal or distinctive). v2 below makes the abnormal-condition and
# voluntary-choice tests the PRIMARY decision procedure and demotes bare
# necessity to "necessary but not sufficient" -- matching how this task's
# gold labels actually decide these classic cases (Hart & Honore /
# Hitchcock & Knobe's abnormal-conditions account of folk causal judgment).

defaults:
  - base_reflexion_prompts

boundaries:
  objectivity_subjectivity: |-
    Given this causal-judgment scenario:
    {input}

    In one or two plain-English sentences, where is the boundary between the facts of the scenario as stated and the ordinary-language judgment call a "typical person" would make about who or what caused the outcome? Do not answer Yes or No yet.
  objectivity_conceptuality: |-
    Given this causal-judgment scenario:
    {input}

    In one or two plain-English sentences, where is the boundary between the concrete sequence of events as stated and whether the named factor was a NORMAL/expected/permitted part of that sequence versus an ABNORMAL, unexpected, or prohibited one? Do not answer Yes or No yet.
  conceptuality_subjectivity: |-
    Given this causal-judgment scenario:
    {input}

    In one or two plain-English sentences, where is the boundary between "this factor was technically necessary for the outcome" and "an ordinary person would actually single this factor out as the cause"? A typical person does not call every necessary factor a cause -- being necessary is not enough on its own. Do not answer Yes or No yet.
perspectives:
  O: |-
    Given this causal-judgment scenario:
    {input}

    Region context:
    {context}

    From an objective perspective, list the stated facts in order: the setup, what counts as the normal/expected/permitted way things were supposed to go, the actions taken by each party, and the outcome (2-4 sentences). Do not answer Yes or No yet.
  S: |-
    Given this causal-judgment scenario:
    {input}

    Region context:
    {context}

    From the perspective of how an ordinary person would judge this, apply this test: if the named factor was a normal, expected, or explicitly permitted action -- especially one where other parties did the identical normal thing at the same time -- an ordinary person usually does NOT call it "the cause," even though it was part of the causal chain. An ordinary person DOES call a factor "the cause" when it was abnormal, unexpected, prohibited, or a deliberate choice that stands out against the normal background. Say which of these two patterns this scenario matches and why (2-4 sentences). Do not answer Yes or No yet.
  B: |-
    Given this causal-judgment scenario:
    {input}

    Region context:
    {context}

    From a conceptual perspective, state plainly: counterfactual necessity (the outcome would not have happened "but for" this factor) is NECESSARY but NOT SUFFICIENT for an ordinary person to call something a cause. The decisive test is whether the factor was abnormal/unexpected/prohibited/a deliberate intervening choice, versus normal/expected/permitted/shared equally among several parties. Name which side of that test this scenario falls on (2-4 sentences).
summary: |-
  Original scenario:
  {input}

  Outermost corner perspectives from a recursive reflexion analysis:

  Objectivity (O):
  {corner_o}

  Subjectivity (S):
  {corner_s}

  Conceptuality (B):
  {corner_b}

  Write one concise plain-English integrated analysis of the causal question. State the relevant facts, then apply this decision procedure explicitly: counterfactual necessity alone does NOT make something "the cause" to a typical person -- normal, expected, permitted actions (especially ones shared identically among several parties) are usually NOT named as causes even when necessary for the outcome; abnormal, unexpected, prohibited, or deliberately chosen actions ARE named as causes. State which side of that test the named factor falls on. Do NOT answer Yes or No yet.
qa: |-
  You are answering how a typical person would judge a causal question (BIG-Bench Hard: causal judgement).

  Reasoning context (may be the raw scenario or an integrated causal analysis):
  {context}

  Question: {question}

  Allowed answers (choose exactly one): {label_space}

  Rules:
  - Reply with ONLY one allowed label.
  - Prefer the form: \\boxed{{LABEL}}
  - No explanation, no analysis, no extra words.
judge: |-
  You are evaluating a causal-judgment benchmark answer (BIG-Bench Hard: causal judgement).

  Gold answer: {gold}
  Model answer: {prediction}
  Allowed answers: {label_space}

  Decide whether the model answer matches the gold answer (allow minor wording differences, e.g. "yes"/"Yes").

  Reply with JSON only:
  {{"correct": true or false, "normalized_answer": "the model answer mapped to an allowed label or UNKNOWN"}}
