# The nano family without the local backend. Useful when Ollama is not running.

defaults:
  - base_conditions
  - published

conditions:
  - name: nano_direct
    backend: nano
  - name: nano_reflexion
    backend: nano
    depth: 1
  - name: nano_reflexion_d2
    backend: nano
    depth: 2
  - name: nano_meta_c1
    backend: nano
    depth: 1
    meta_cycles: 1
  - name: nano_meta_c2
    backend: nano
    depth: 1
    meta_cycles: 2
  - name: nano_meta_c3
    backend: nano
    depth: 1
    meta_cycles: 3
