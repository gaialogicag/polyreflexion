# The experiment grid. Each entry is one cell: a backend, a reflexion depth,
# and a meta cycle budget. Everything else about a condition -- its summary
# cache key, whether it needs a summary pass, which budget it continues from --
# is derived from those three numbers in polyrx/conditions.py.
#
# Order is report column order.
#
# Adding a condition is one entry here. Changing an existing one changes its
# cache key, which orphans every summary already on disk: re-lock with
# `polyrx-conditions lock` and say which published results it invalidates.

defaults:
  - base_conditions

# depth 0 means the model answers the item directly, with no reflexion pass.
# meta_cycles 0 disables the meta layer. A meta condition runs a depth-1
# reflexion on cycle 0, which is why they all carry depth 1.
conditions:
  - name: answerer_direct
    backend: answerer

  - name: answerer_reflexion
    backend: answerer
    depth: 1
  - name: answerer_reflexion_d2
    backend: answerer
    depth: 2
  - name: answerer_reflexion_d3
    backend: answerer
    depth: 3
  - name: answerer_reflexion_d5
    backend: answerer
    depth: 5
  - name: answerer_reflexion_d6
    backend: answerer
    depth: 6
  - name: answerer_reflexion_d7
    backend: answerer
    depth: 7

  - name: answerer_meta_c1
    backend: answerer
    depth: 1
    meta_cycles: 1
  - name: answerer_meta_c2
    backend: answerer
    depth: 1
    meta_cycles: 2
  - name: answerer_meta_c3
    backend: answerer
    depth: 1
    meta_cycles: 3
  - name: answerer_meta_c4
    backend: answerer
    depth: 1
    meta_cycles: 4
  - name: answerer_meta_c5
    backend: answerer
    depth: 1
    meta_cycles: 5
  - name: answerer_meta_c6
    backend: answerer
    depth: 1
    meta_cycles: 6
  - name: answerer_meta_c7
    backend: answerer
    depth: 1
    meta_cycles: 7
  - name: answerer_meta_c8
    backend: answerer
    depth: 1
    meta_cycles: 8
  - name: answerer_meta_c9
    backend: answerer
    depth: 1
    meta_cycles: 9
  - name: answerer_meta_c10
    backend: answerer
    depth: 1
    meta_cycles: 10

  - name: answerer_meta
    backend: answerer
    depth: 1
    meta_cycles: 2
    alias_of: answerer_meta_c2
    note: Legacy alias kept for older result files.

  # The open-weights arm mirrors the answerer arm cell for cell, so a gap
  # between them is a difference between the models rather than a difference
  # in how far each one was allowed to go.
  - name: open_weights_direct
    backend: open_weights
  - name: open_weights_reflexion
    backend: open_weights
    depth: 1
  - name: open_weights_reflexion_d2
    backend: open_weights
    depth: 2
  - name: open_weights_reflexion_d3
    backend: open_weights
    depth: 3

  - name: open_weights_meta_c1
    backend: open_weights
    depth: 1
    meta_cycles: 1
  - name: open_weights_meta_c2
    backend: open_weights
    depth: 1
    meta_cycles: 2
  - name: open_weights_meta_c3
    backend: open_weights
    depth: 1
    meta_cycles: 3
  - name: open_weights_meta_c4
    backend: open_weights
    depth: 1
    meta_cycles: 4
