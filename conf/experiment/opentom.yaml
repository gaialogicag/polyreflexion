# @package _global_
# OpenToM Theory-of-Mind pilot.
#
# Differences between conditions here have been small relative to the sample
# size. Run enough stories that the gap you care about is larger than the
# noise before reading anything into it.

defaults:
  - override /dataset: opentom
  - override /meta: opentom
  - override /engine: default
  - override /prompts/reflexion: default
  - override /prompts/meta: opentom

experiment:
  num_items: 10
  seed: 42
  max_workers: 4
  conditions:
    - answerer_direct
    - answerer_reflexion
    - answerer_reflexion_d2
    - answerer_reflexion_d3
    - answerer_meta_c1
    - answerer_meta_c2
    - answerer_meta_c3
    - answerer_meta_c4
  use_stub: false
  cache_namespace: ""
  detailed: false
  merge_from: null
  extend_from: null
  drop_conditions: []
