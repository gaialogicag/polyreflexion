# @package _global_
# BIG-Bench Hard: tracking_shuffled_objects_seven_objects, 250 items.
# MCQ shape, but needs its own reflexion prompt set (bbh_tracking), not
# `default` -- EXP-25 found `default` is Hi-ToM/OpenToM's belief-tracking
# prompt, which pushed the model to narrate beliefs instead of executing the
# swaps. See conf/prompts/reflexion/bbh_tracking.yaml.

defaults:
  - override /dataset: bbh_tracking_shuffled_objects_seven_objects
  - override /meta: bbh
  - override /engine: default
  - override /prompts/reflexion: bbh_tracking
  - override /prompts/meta: default

experiment:
  num_items: 10
  seed: 42
  max_workers: 4
  conditions:
    - answerer_direct
    - answerer_reflexion
    - answerer_reflexion_d2
    - answerer_meta_c1
    - answerer_meta_c2
    - answerer_meta_c3
  use_stub: false
  cache_namespace: ""
  detailed: false
  merge_from: null
  extend_from: null
  drop_conditions: []
