# @package _global_
# BIG-Bench Hard: causal_judgement. Two-way (Yes/No) shape. Uses its own
# causal-framing prompt set (bbh_causal), not `default` (Hi-ToM/OpenToM's
# belief-tracking prompt) -- EXP-25 found `default` hurt clearly on the
# tracking tasks and left open whether it also hurts here; bbh_causal tests
# that directly instead of assuming it. See conf/prompts/reflexion/bbh_causal.yaml.

defaults:
  - override /dataset: bbh_causal_judgement
  - override /meta: bbh
  - override /engine: default
  - override /prompts/reflexion: bbh_causal
  - override /prompts/meta: default

experiment:
  num_items: 10
  seed: 42
  max_workers: 4
  conditions:
    - answerer_direct
    - answerer_reflexion
    - answerer_reflexion_d2
    - answerer_meta_c1
    - answerer_meta_c2
    - answerer_meta_c3
  use_stub: false
  cache_namespace: ""
  detailed: false
  merge_from: null
  extend_from: null
  drop_conditions: []
