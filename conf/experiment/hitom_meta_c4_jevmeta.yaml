# @package _global_
# Hi-ToM, meta_c4 only, meta_judge=AnyJev instead of gpt-4o-mini -- a first
# batch of 20 stories x 5 belief orders = 100 questions, to check the
# polycontextural loop converges sensibly under a typed-verdict meta_judge
# before spending on the full 240-story set.

defaults:
  - override /dataset: hitom
  - override /meta: hitom
  - override /engine: default
  - override /prompts/reflexion: default
  - override /prompts/meta: opentom

experiment:
  num_items: 20
  seed: 42
  max_workers: 4
  conditions:
    - answerer_meta_c4
  use_stub: false
  cache_namespace: ""
  detailed: false
  merge_from: null
  extend_from: null
  drop_conditions: []
