# Root configuration. Every entry point composes from here.
#
# Override anything on the command line:
#   polyrx-bench experiment.num_items=50 backends.answerer.model=gpt-4o-mini
# Sweep with -m (Hydra multirun), which replaces the old incremental scripts:
#   polyrx-bench -m experiment=gpqa 'experiment.conditions=[answerer_meta_c1],[answerer_meta_c2]'

defaults:
  # The structured schema from polyreflexion.config, registered in conf_store.
  # Composing onto it is what makes a typo in a YAML key fail here rather than
  # at the line that eventually reads it.
  - base_config
  - backends: openai
  - dataset: exploretom
  - conditions: published
  - engine: default
  - prompts/reflexion: default
  - prompts/meta: default
  - meta: default
  - paths: default
  - postprocess: default
  - report: default
  - provenance: default
  - _self_
  # Last on purpose: an experiment is a global patch, so it has to be composed
  # after the groups it overrides.
  - experiment: exploretom

hydra:
  job:
    # Keep the process in the directory the user launched from. Relative paths
    # in `paths` then mean what the user expects, and results do not scatter
    # into per-run subdirectories that the report tooling cannot find.
    chdir: false
  run:
    dir: ${paths.results_dir}/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${paths.results_dir}/hydra/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
