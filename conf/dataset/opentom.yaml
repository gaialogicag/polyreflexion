# OpenToM: theory-of-mind questions over short narratives.
#
# Has its own adapter because the allowed answers depend on the question:
# "where will Sam look?" is scored against the places that story mentions, not
# against a fixed list. Several questions share each narrative, so items are
# sampled by context.

defaults:
  - base_dataset

name: opentom
adapter: opentom
group_name: question type
sample_by: context

primary:
  repo_id: SeacowX/OpenToM
  filename: opentom.json
  # A Hub commit sha, not a branch: `main` would make the run unreproducible,
  # and the runner says so. `polyrx-manifest pin` resolves the current commit
  # and records its checksum in data/MANIFEST.json. Moving to a newer revision
  # is a deliberate act -- re-pin, and say which published numbers it replaces.
  revision: 552b91aaeca0a651647cc3f331a47dcd7e77d0eb
  repo_type: dataset
  gated: false
fallbacks: []
extras: []
verify_checksums: true
