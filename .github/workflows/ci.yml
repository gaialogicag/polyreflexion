name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src
      - run: ruff format --check src
      - run: mypy

  smoke:
    # The whole pipeline on stub clients: no API key, no network, no cost.
    # Catches a broken call site, a missing packaged prompt, or a config tree
    # that no longer composes.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[viz,gpqa]"
      - name: Offline benchmark run
        run: polyrx-bench experiment=smoke

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Prompt templates and config tree must ship in the wheel
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "polyreflexion/prompts/reflexion.json",
              "polyreflexion/prompts/meta_default.json",
              "polyreflexion/conf/config.yaml",
          ]
          missing = [r for r in required if r not in names]
          if missing:
              sys.exit(f"missing from wheel: {missing}")
          print(f"{wheel}: packaged data present")
          PY
