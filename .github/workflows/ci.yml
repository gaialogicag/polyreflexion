name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src
      - run: ruff format --check src
      - run: mypy

  smoke:
    # The whole pipeline on stub clients: no API key, no network, no cost.
    # Catches a broken call site, a missing packaged prompt, or a config tree
    # that no longer composes.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[viz,gpqa]"
      - name: Offline benchmark run
        run: polyrx-bench experiment=smoke
      - name: Offline sweep, and the interactive tools
        run: |
          polyrx-bench -m experiment=smoke \
            'experiment.conditions=[nano_direct],[nano_reflexion]'
          polyrx-ask --stub "offline smoke test"
          polyrx-reflect --stub "offline smoke test"

  no-extras:
    # The viz and gpqa extras must be genuinely optional: a base install has to
    # produce a report, with the figures skipped rather than an ImportError.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: polyrx-bench experiment=smoke

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Wheel must carry the prompts and must not carry the config tree
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "polyreflexion/prompts/reflexion.json",
              "polyreflexion/prompts/meta_default.json",
          ]
          missing = [r for r in required if r not in names]
          if missing:
              sys.exit(f"missing from wheel: {missing}")
          # conf/ lives at the repository root on purpose; shipping a second
          # copy inside the wheel would make it ambiguous which one is live.
          leaked = [n for n in names if "/conf/" in n]
          if leaked:
              sys.exit(f"config tree must not be packaged: {leaked[:5]}")
          print(f"{wheel}: prompts packaged, config tree correctly absent")
          PY
