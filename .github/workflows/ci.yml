name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,viz,gpqa]"
      - run: ruff check src
      - run: ruff format --check src
      - run: mypy

  smoke:
    # The whole pipeline on stub clients: no API key, no network, no cost.
    # Catches a broken call site, a missing packaged prompt, or a config tree
    # that no longer composes.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[viz,gpqa]"
      - name: Preflight reports the environment honestly
        run: polyrx-doctor || true
      - name: Offline benchmark run
        run: polyrx-bench experiment=smoke
      - name: Offline sweep, and the interactive tools
        run: |
          polyrx-bench -m experiment=smoke \
            'experiment.conditions=[answerer_direct],[answerer_reflexion]'
          polyrx-ask --stub "offline smoke test"
          polyrx-reflect --stub "offline smoke test"
      - name: A new dataset needs config only
        run: |
          mkdir -p /tmp/ds
          printf 'passage,q,a,allowed,kind\n"Ann hid it.","Is it hidden?","Yes","Yes, No",basic\n' > /tmp/ds/t.csv
          cat > conf/dataset/_ci_tmp.yaml <<'EOF'
          defaults:
            - base_dataset
          name: _ci_tmp
          adapter: tabular
          fields: {context: passage, question: q, answer: a, label_space: allowed, group: kind}
          primary: {path: /tmp/ds/t.csv}
          EOF
          polyrx-bench experiment=smoke dataset=_ci_tmp experiment.num_items=1
          rm conf/dataset/_ci_tmp.yaml
      - name: The condition grid matches its lock
        run: polyrx-conditions check
      - name: Prompt sets are selectable and overridable
        run: |
          polyrx-bench -m experiment=smoke prompts/meta=default,opentom,gpqa
          polyrx-bench experiment=smoke \
            'prompts.meta.drift_check="CUSTOM {answer}"' --cfg job

  no-extras:
    # The viz and gpqa extras must be genuinely optional: a base install has to
    # produce a report, with the figures skipped rather than an ImportError.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: polyrx-bench experiment=smoke

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Wheel must not carry configuration
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          # The config tree and the prompt templates live at the repository
          # root. A second copy inside the wheel would make it ambiguous which
          # one a run actually used.
          leaked = [n for n in names if "/conf/" in n or "/prompts/" in n]
          if leaked:
              sys.exit(f"configuration must not be packaged: {leaked[:5]}")
          if not any(n.endswith("polyrx/engine.py") for n in names):
              sys.exit("wheel does not contain the package")
          print(f"{wheel}: code packaged, configuration correctly absent")
          PY
